[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "poe2etl"
version = "0.1.0"
description = "Offline PoE2 catalog pipeline foundation; collection is not enabled"
requires-python = ">=3.12,<3.13"
dependencies = ["beautifulsoup4==4.14.3", "pandas==2.3.3"]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.3"]

[project.scripts]
poe2etl = "poe2etl.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

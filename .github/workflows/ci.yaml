name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows-dev-script:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts/tests -v
        shell: powershell
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon check generateJooq bootJar
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run typecheck && npm run format:check && npm run test -- --run && npm run build
        working-directory: frontend
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.9.7
      - run: uv sync --frozen && uv run --frozen ruff check . && uv run --frozen ruff format --check . && uv run --frozen python -m pytest
        working-directory: data-pipeline
  images:
    needs: [backend, frontend, pipeline, windows-dev-script]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example -f infra/compose.yaml --profile stack --profile batch config --quiet
      - run: docker compose --env-file .env.example -f infra/compose.yaml --profile stack --profile batch build

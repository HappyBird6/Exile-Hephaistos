# 백엔드 운영 설정. 기본값은 리팩토링 이전 동작을 유지한다.
# 경로는 backend/src/main/java/com/poe2craft/ 기준이다.
# 변경 후 서버 재시작이 필요하다. BACKEND_... 환경변수로도 덮어쓸 수 있다.
# 확률·weight·옵션 수·API 버전·저장 스키마는 운영 설정이 아니므로 여기에 넣지 않는다.
backend:
  admin-logs:
    # 한국시간 오늘 외에 DB에서 조회할 지난 날짜 수. 사용: admin/application/RequestLogService.java.
    previous-days: 7
    # 압축 로그 보관 기간. 사용: RequestLogStore의 보관 정리.
    archive-days: 30
    # 압축 파일 총량 상한(1 GiB). 오래된 파일부터 삭제. 사용: RequestLogStore.
    archive-max-bytes: 1073741824
    # 하루 상세 로그 저장 상한. 초과는 dropped로 표시. 사용: RequestLogStore.
    daily-records: 100000
    # 필터별 통계 캐시 개수와 유효 시간. 사용: admin/infrastructure/RequestLogStore.
    statistics-cache-entries: 64
    statistics-cache-millis: 5000
    # 날짜별 집계·보관 경계와 관리자 날짜/그래프의 시간대. 사용: RequestLogService·RequestLogStore·관리자 화면.
    time-zone: Asia/Seoul
    # 요청/보관 파일 목록의 한 페이지 크기. 사용: RequestLogStore·관리자 화면.
    page-size: 40
    # 요청 스레드에서 DB를 기다리지 않는 대기열 상한. 초과/실패 건수는 관리자 화면에 표시. 같은 파일에서 사용.
    queue-capacity: 10000
    # 한 번에 DB에 넣거나 파일로 옮길 최대 로그 수. 같은 파일 및 admin/infrastructure/RequestLogStore.java에서 사용.
    batch-size: 500
    # 비동기 저장 주기(ms). 사용: RequestLogService.flush.
    flush-millis: 2000
    # 만료 날짜의 파일 보관 작업 주기(ms). 사용: RequestLogService.archive.
    archive-millis: 60000
    # 한 차례 파일 보관 작업의 시간 예산(ms). 장시간 다른 예약 작업을 지연시키지 않음. 사용: RequestLogService.archive.
    archive-work-millis: 5000
    # 공개 웹 루트 밖의 압축 보관 경로. 사용: RequestLogStore. Compose app-data 볼륨에 보존.
    archive-directory: data/operations-logs
  request-protection:
    # 인스턴스 전체 API 초당 허용량. IP별 제한은 Nginx에서 수행한다.
    # 사용: bootstrap/http/ApiRequestProtection.java. 프록시 헤더를 신뢰하지 않는다.
    requests-per-second: 120
    # 짧은 초기 카탈로그/화면 요청 묶음을 허용하는 토큰 수. 같은 파일에서 사용.
    burst: 240
    # 본문 읽기부터 응답 완료까지 동시에 처리할 API 수. 같은 파일에서 사용.
    max-in-flight: 32
    # 길이 미상/chunked 요청도 포함한 본문 바이트 상한. 같은 파일에서 사용.
    max-body-bytes: 262144
  path-search:
    # 메모리에 보관할 v1 경로 탐색 작업 수. 완료·만료 정책과 함께 용량을 결정한다.
    # 사용: craftingsupport/search/application/PathSearchService.java
    max-jobs: 16
    # 작업별로 보관할 과거 그래프 revision 수.
    # 사용: craftingsupport/search/application/PathSearchService.java
    max-revisions: 8
    # 그래프 페이지 하나에 담는 edge 수.
    # 사용: craftingsupport/search/application/PathSearchService.java
    page-edges: 48
    # 작업별 중복 요청 판별용으로 보관할 제어 명령 수.
    # 사용: craftingsupport/search/application/PathSearchService.java
    max-commands: 64
    # 한 번 실행할 때 허용하는 계산 반복 횟수. 부족하면 미해결 상태를 보존한다.
    # 사용: craftingsupport/search/application/PathSearchService.java
    run-budget: 50000
    # v1 작업 유효 시간. 작업 생성 시각을 기준으로 한다.
    # 사용: craftingsupport/search/application/PathSearchService.java
    ttl: 15m
  method-search:
    # 구형 v2 method 탐색 작업 보관 수와 실행 대기열 용량.
    # 사용: craftingsupport/search/application/MethodSearchService.java
    max-jobs: 8
    # 작업별로 보관할 과거 revision 수.
    # 사용: craftingsupport/search/application/MethodSearchService.java
    max-revisions: 4
    # 탐색 방법 목록 한 페이지의 항목 수.
    # 사용: craftingsupport/search/application/MethodSearchService.java
    page-size: 12
    # 작업별 중복 요청 판별용 제어 명령 보관 수.
    # 사용: craftingsupport/search/application/MethodSearchService.java
    max-commands: 64
    # 일반 method 탐색의 실행당 계산 반복 예산.
    # 사용: craftingsupport/search/application/MethodSearchService.java
    run-budget: 12000
    # certified 탐색의 실행당 계산 반복 예산.
    # 사용: craftingsupport/search/application/MethodSearchService.java → CertifiedSearchJobs.java
    certified-run-budget: 1000000
    # method 계산 엔진이 보관할 개별 outcome 상한. 게임 규칙의 옵션 수와 다르다.
    # 사용: craftingsupport/search/application/MethodSearchService.java
    kernel-outcome-limit: 100000
    # worker가 취소·재개 상태를 다시 확인하기 전 계산하는 시간 구간.
    # 사용: craftingsupport/search/application/MethodSearchService.java
    time-slice: 20ms
    # 구형 method 작업 유효 시간. 생성 시각을 기준으로 한다.
    # 사용: craftingsupport/search/application/MethodSearchService.java
    ttl: 20m
  certified-search:
    # 동시에 보관할 certified 탐색 작업 수.
    # 사용: craftingsupport/search/application/CertifiedSearchJobs.java
    max-jobs: 2
    # certified 작업 lease 유효 시간. 기존 요청 처리 시 갱신하는 동작을 유지한다.
    # 사용: craftingsupport/search/application/CertifiedSearchJobs.java
    ttl: 20m
  automatic-search:
    # 메모리에 활성 상태로 올려둘 현행 자동 탐색 작업 수.
    # 사용: craftingsupport/search/application/AutomaticSearchService.java
    max-active: 16
    # 자동 작업의 유효 시간. 기존 저장·제어 흐름에서 갱신한다.
    # 사용: craftingsupport/search/application/AutomaticSearchService.java
    ttl: 24h
    # 제어 요청 한 번에서 진행할 계산 시간. 확률이나 탐색 정밀도 자체를 바꾸지 않는다.
    # 사용: craftingsupport/search/application/AutomaticSearchService.java
    time-slice: 300ms
  cache:
    # 구형 전이 캐시에 보관할 상태·행동 조합 수.
    # 사용: bootstrap/LegacyGraphConfiguration.java → craftingsupport/path/application/TransitionCache.java
    transition-entries: 256
    # 구형 전이 캐시 전체에 보관할 outcome 수.
    # 사용: bootstrap/LegacyGraphConfiguration.java → craftingsupport/path/application/TransitionCache.java
    transition-outcomes: 25000
    # 제작 추천 addition pool 메모리 캐시 항목 수.
    # 사용: bootstrap/CraftingSupportConfiguration.java → craftingsupport/recommendation/application/AdditionPoolCache.java
    addition-entries: 2048
  storage:
    # method·certified·automatic 작업 저장소의 기준 디렉토리. 기존 파일을 이동하지 않는다.
    # 사용: bootstrap/CraftingSupportConfiguration.java
    # 저장 구현: craftingsupport/search/infrastructure/LocalCertifiedJobRepository.java
    # 자동 작업 저장 구현: craftingsupport/search/infrastructure/LocalAutomaticJobRepository.java
    # 기존 crafting.method-job-directory / CRAFTING_METHOD_JOB_DIRECTORY 설정을 계속 지원한다.
    method-job-directory: ${crafting.method-job-directory:./data/method-jobs}
  workbench:
    # 동시에 실행할 카오스 반복 요청 수. 단일 제작 API와 별도 제한이다.
    # 사용: workbench/repeat/ChaosRepeatService.java, workbench/api/ChaosRepeatController.java
    repeat-concurrency: 1
    # 반복 제작의 벽시계 예산. 단계 사이에 중단하고 완료한 부분은 영수증으로 반환한다.
    # 사용: workbench/repeat/ChaosRepeatService.java
    repeat-time-budget: 10s
    # 요청 ID별 결과·미확정 상태 보관 기간. 같은 요청의 재전송에서 중복 난수 실행을 방지한다.
    # 사용: workbench/infrastructure/RedisRepeatRequestStore.java
    repeat-receipt-ttl: 10m
    # 반복 제작 이외 제작 HTTP 요청의 프로세스별 동시 처리 한도. 초과분은 대기열 없이 429.
    # 사용: bootstrap/http/WorkloadAdmission.java
    request-concurrency: 16
    # 옵션 판정용 불변 카탈로그 인덱스의 프로세스별 최대 보관 개수.
    # 사용: workbench/application/ModifierReferenceService.java
    reference-catalog-entries: 64
    # 옵션 풀 판정 및 변경분 기준의 LRU 개수 상한. 사용: workbench/application/ModifierReferenceService.
    reference-state-entries: 128
    # 보류 중인 제작지원 API의 활성 여부. workbench-production 프로필에서는 false.
    # 사용: bootstrap/http/WorkloadAdmission.java
    support-enabled: true

  prices:
    # 시세 제공 서버의 주소. PoE2의 현재 일반 거래 리그를 이 서버의 목록에서 선택한다.
    # 사용: bootstrap/CurrencyPriceConfiguration.java → shared/economy/infrastructure/NinjaCurrencyPriceSource.java
    source-url: https://poe.ninja
    # 외부 연결에 필요한 HTTP 프록시. HTTPS_PROXY가 없으면 직접 연결한다. 인증 정보는 설정 파일에 적지 않는다.
    # 사용: bootstrap/CurrencyPriceConfiguration.java
    proxy-url: ${HTTPS_PROXY:}
    # 외부 시세 요청에 포함할 서비스 식별 정보.
    # 사용: shared/economy/infrastructure/NinjaCurrencyPriceSource.java
    user-agent: Exile-Hephaistos/0.5.5 (+https://github.com/HappyBird6/Exile-Hephaistos)
    # Redis 시세 스냅샷·갱신 잠금·공용 재요청 제한의 키 접두어. 중괄호는 같은 Redis Cluster 슬롯을 지정한다.
    # 사용: shared/economy/infrastructure/RedisCurrencyPriceCache.java
    cache-key: 'hephaistos:{currency-prices}:v1'
    # 자동 수집 간격 및 시세가 오래되었다고 판단하는 시간.
    # 사용: bootstrap/CurrencyPriceConfiguration.java, shared/economy/application/CurrencyPriceService.java
    refresh-interval: 30m
    # 수집 만료 여부 확인 간격. 확인 자체는 외부 요청을 발생시키지 않는다.
    # 사용: bootstrap/CurrencyPriceConfiguration.java
    check-interval: 1m
    # 모든 사용자가 공유하는 외부 재요청 최소 간격. 실패한 요청에도 적용한다.
    # 사용: shared/economy/application/CurrencyPriceService.java → shared/economy/infrastructure/RedisCurrencyPriceCache.java
    minimum-refresh-interval: 5m
    # 한 수집 작업의 Redis 잠금 유효 시간. 만료된 수집기는 새 스냅샷을 덮어쓸 수 없다.
    # 사용: shared/economy/infrastructure/RedisCurrencyPriceCache.java
    refresh-lease: 60s
    # 외부 서버 연결 대기 제한.
    # 사용: bootstrap/CurrencyPriceConfiguration.java
    connect-timeout: 3s
    # 외부 요청 하나의 처리 시간 제한.
    # 사용: shared/economy/infrastructure/NinjaCurrencyPriceSource.java
    request-timeout: 8s
    # 서버 시작 후 첫 자동 수집까지의 대기 시간.
    # 사용: bootstrap/CurrencyPriceConfiguration.java
    initial-delay: 5s
    # 작업대 제작 재료와 장착 재료의 시세 분류. Currency는 기준 환율 계산에 필수다.
    # 사용: shared/economy/infrastructure/NinjaCurrencyPriceSource.java
    categories: [Currency, Essences, Ritual, Breach, Delirium, Abyss, Runes, SoulCores, Idols]

account:
  library:
    # Maximum UTF-8 JSON bytes per saved document; PostgresAccountLibrary.
    max-document-bytes: 200000
    # Maximum saved document identities per account, including deletion markers; PostgresAccountLibrary.
    max-documents: 2000
  auth:
    # Enable temporary username/password authentication; AccountController.
    enabled: ${ACCOUNT_AUTH_ENABLED:true}
    # BCrypt work factor; PasswordAccounts. Changing it affects new password hashes.
    bcrypt-cost: 12
    # Maximum password checks/registrations per IP per minute; AccountAccessFilter.
    attempts-per-minute: 10
    # Maximum concurrent expensive password operations per server; PasswordAccounts.
    max-concurrent: 4
    # Minimum password characters; PasswordAccounts. BCrypt also limits UTF-8 to 72 bytes.
    minimum-password-length: 8

community:
  # Public game-version selector default; PostgresSessionBoard.options. Does not change crafting rules.
  current-version: "0.5.5"
  # Public session JSON cap, below the shared HTTP request limit; SharedSession validation.
  max-session-bytes: 200000
  # Maximum saved steps in one post; SharedSession validation.
  max-frames: 2000
  # Rows per board page; PostgresSessionBoard.list.
  page-size: 20
  # Member post text length; PostgresSessionBoard.
  max-body-length: 5000
  # Per-IP community mutations per minute; CommunityWriteLimit.
  writes-per-minute: 30
  # Maximum plain-text comment length; PostgresCommunityComments.
  max-comment-length: 2000

spring:
  config:
    import: classpath:backend-settings.yaml
  application:
    name: poe2craft
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  session:
    timeout: 30m
    redis:
      namespace: hephaistos:account:sessions
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jooq:
    sql-dialect: POSTGRES
  flyway:
    enabled: true
    clean-disabled: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}
      connect-timeout: 2s
      timeout: 2s
server:
  servlet:
    session:
      cookie:
        name: HEPHAISTOS_SESSION
        http-only: true
        same-site: lax
        secure: ${ACCOUNT_COOKIE_SECURE:false}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
logging:
  structured:
    format:
      console: ecs

# Sample approximately 1/16 of edge rejections to bounded container logs, never to the JVM.
map $request_id $sample_edge_rejection { default 0; ~^0 1; }
log_format edge_rejection escape=json '{"kind":"edge_rejection_sample","time":"$time_iso8601","ip":"$remote_addr","method":"$request_method","path":"$uri","status":429}';
# Per-client admission precedes JVM work. $binary_remote_addr is the direct peer;
# configure a trusted real_ip proxy explicitly before deploying behind a CDN/load balancer.
limit_req_zone $binary_remote_addr zone=api_per_client:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=repeat_per_client:10m rate=2r/s;
limit_req_status 429;
# Bound simultaneous connections/HTTP2 requests from a single direct client.
limit_conn_zone $binary_remote_addr zone=connections_per_client:10m;
limit_conn_status 429;
limit_req_zone $binary_remote_addr zone=admin_per_client:1m rate=2r/s;
limit_req_zone $binary_remote_addr zone=telemetry_per_client:1m rate=6r/m;
# Versioned catalogs and public prices can be shared across visitors. Bounded, disposable disk cache.
proxy_cache_path /tmp/workbench-cache levels=1:2 keys_zone=workbench_cache:10m max_size=128m inactive=1h use_temp_path=off;
upstream crafting_backend {
    server app:8080;
    keepalive 16;
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 256k;
    limit_conn connections_per_client 24;
    server_tokens off;
    # Bound transfer rate per active response; upstream CDN budgets remain deployment-specific.
    limit_rate 2m;
    limit_rate_after 1m;
    client_body_timeout 10s;
    send_timeout 30s;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/problem+json application/javascript text/css image/svg+xml;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Overwrite, never append, browser-supplied client address headers.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    # Retrying a random craft on a second upstream could produce a different result.
    proxy_next_upstream off;
    location = /api/v1/crafting/workbench/chaos-repeat {
        limit_req zone=repeat_per_client burst=2 nodelay;
        include /etc/nginx/chaos-repeat-limits.conf;
        proxy_pass http://crafting_backend;
    }
    location ^~ /api/v1/crafting/catalogs/ {
        limit_req zone=api_per_client burst=40 nodelay;
        proxy_cache workbench_cache;
        proxy_cache_lock on;
        proxy_cache_valid 200 1h;
        add_header X-Cache-Status $upstream_cache_status;
        proxy_pass http://crafting_backend;
    }
    location = /api/v1/economy/prices {
        limit_req zone=api_per_client burst=40 nodelay;
        proxy_cache workbench_cache;
        proxy_cache_lock on;
        proxy_cache_valid 200 30s;
        # A manual refresh's short follow-up poll explicitly revalidates the origin snapshot.
        proxy_cache_bypass $http_cache_control;
        proxy_no_cache $http_cache_control;
        add_header X-Cache-Status $upstream_cache_status;
        proxy_pass http://crafting_backend;
    }
    location = /api/telemetry {
        limit_req zone=telemetry_per_client burst=3 nodelay;
        client_max_body_size 2k;
        proxy_pass http://crafting_backend;
    }
    location ^~ /api/admin/ {
        limit_req zone=admin_per_client burst=5 nodelay;
        proxy_pass http://crafting_backend;
    }
    location ~ /\.(?!well-known(?:/|$)) { return 404; }
    location /api/ {
        limit_req zone=api_per_client burst=40 nodelay;
        proxy_pass http://crafting_backend;
    }
    # An inaccessible public endpoint records edge rejections without invoking crafting work.
    location = /api/edge-rejected { return 404; }
    # Reject at the edge without creating backend/DB work for every denied request.
    error_page 429 = @rejection_fallback;
    location @rejection_fallback { access_log /dev/stdout edge_rejection if=$sample_edge_rejection; add_header Retry-After 1 always; return 429; }
    location = /healthz {
        access_log off;
        proxy_pass http://crafting_backend/actuator/health/readiness;
    }
    # Vite assets have content hashes; stale entry documents must never pin old chunk names.
    location ~ "^/assets/[^/]+-[A-Za-z0-9_-]{8,}[.](js|css|woff2?|png|webp|svg)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # Public game images keep stable names and therefore must remain revalidatable.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}

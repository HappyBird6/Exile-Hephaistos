# Local development only. No deployment or production account policy is implied.
name: exile-hephaistos
services:
  postgres:
    image: postgres:17.6-alpine
    user: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.5-alpine
    user: redis
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    profiles: [stack]
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Backend port remains loopback-only; trust Tomcat internal-proxy forwarding from Nginx.
      SERVER_FORWARD_HEADERS_STRATEGY: native
    volumes:
      - app-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${EXILE_BACKEND_PORT:-9000}:8080"
  frontend:
    profiles: [stack]
    build:
      context: ..
      dockerfile: infra/docker/frontend.Dockerfile
    depends_on: [app]
    ports:
      - "127.0.0.1:${EXILE_FRONTEND_PORT:-9001}:8080"
volumes:
  postgres-data:
    external: true
    name: ${POSTGRES_VOLUME_NAME:-exile-hephaistos_postgres-data}
  app-data:
    external: true
    name: exile-hephaistos_app-data
